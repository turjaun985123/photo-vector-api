<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo ID Search Test</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #18212f; background: #f4f6fa; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1080px, calc(100% - 32px)); margin: 40px auto 64px; }
    header { margin-bottom: 24px; }
    h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); margin: 0 0 8px; letter-spacing: -.035em; }
    p { color: #586579; margin: 0; line-height: 1.55; }
    .panel { background: white; border: 1px solid #e0e5ee; border-radius: 18px; padding: 22px; box-shadow: 0 8px 28px #18212f0b; }
    .controls { display: grid; grid-template-columns: minmax(0, 1fr) 150px auto; gap: 14px; align-items: end; }
    label { display: grid; gap: 8px; color: #344258; font-size: .92rem; font-weight: 650; }
    input, button { font: inherit; }
    input[type=file], input[type=number] { width: 100%; border: 1px solid #ccd4e0; border-radius: 10px; padding: 11px; background: #fff; color: #18212f; }
    button { border: 0; border-radius: 10px; background: #2259c7; color: white; font-weight: 700; padding: 12px 20px; cursor: pointer; min-height: 44px; }
    button:hover { background: #1748ad; }
    button:disabled { opacity: .55; cursor: wait; }
    .query { display: none; gap: 16px; align-items: center; margin-top: 18px; }
    .query.visible { display: flex; }
    .query img { width: 112px; height: 112px; object-fit: contain; border-radius: 12px; background: #eef1f6; border: 1px solid #e0e5ee; }
    .status { min-height: 24px; margin-top: 16px; font-size: .92rem; color: #586579; }
    .status.error { color: #b42318; }
    .summary { margin: 24px 0 12px; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
    .summary h2 { font-size: 1.15rem; margin: 0; }
    .summary span { font-size: .85rem; color: #68758a; }
    .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
    .card { overflow: hidden; background: #fff; border: 1px solid #e0e5ee; border-radius: 14px; box-shadow: 0 5px 18px #18212f08; }
    .card img { display: block; width: 100%; height: 220px; object-fit: contain; background: #eef1f6; }
    .card.no-preview img { display: none; }
    .card-info { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 13px; }
    .photo-id { font-weight: 750; overflow-wrap: anywhere; }
    .score { color: #2259c7; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
    .empty { border: 1px dashed #c7d0de; border-radius: 14px; padding: 28px; text-align: center; color: #68758a; background: #ffffff99; }
    @media (max-width: 680px) { main { margin-top: 22px; } .controls { grid-template-columns: 1fr 110px; } button { grid-column: 1 / -1; } .panel { padding: 16px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Find a photo by image</h1>
      <p>Upload a customer's screenshot or crop to search indexed photos by visual similarity. <a href="/products">Index product photos</a></p>
    </header>

    <section class="panel" aria-label="Image search form">
      <form id="search-form">
        <div class="controls">
          <label>Screenshot or crop
            <input id="image-file" type="file" accept="image/jpeg,image/png,image/webp" required>
          </label>
          <label>Number of matches
            <input id="top-k" type="number" min="1" max="100" value="5">
          </label>
          <button id="search-button" type="submit">Find photo IDs</button>
        </div>
      </form>
      <div id="query-preview" class="query">
        <img id="query-image" alt="Selected query image preview">
        <div><strong id="query-name"></strong><p id="query-size"></p></div>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">Choose an image to start.</div>
    </section>

    <div class="summary">
      <h2>Closest matches</h2>
      <span id="index-size"></span>
    </div>
    <section id="results" class="results" aria-live="polite">
      <div class="empty">Search results will appear here.</div>
    </section>
  </main>
  <script>
    const form = document.querySelector('#search-form');
    const fileInput = document.querySelector('#image-file');
    const button = document.querySelector('#search-button');
    const statusBox = document.querySelector('#status');
    const results = document.querySelector('#results');
    const queryPreview = document.querySelector('#query-preview');
    let previewUrl = null;

    fileInput.addEventListener('change', () => {
      const file = fileInput.files[0];
      if (!file) return;
      if (previewUrl) URL.revokeObjectURL(previewUrl);
      previewUrl = URL.createObjectURL(file);
      document.querySelector('#query-image').src = previewUrl;
      document.querySelector('#query-name').textContent = file.name;
      document.querySelector('#query-size').textContent = `${(file.size / 1024).toFixed(1)} KB`;
      queryPreview.classList.add('visible');
      statusBox.classList.remove('error');
      statusBox.textContent = 'Ready to search.';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const file = fileInput.files[0];
      if (!file) return;
      const topK = Math.max(1, Math.min(100, Number(document.querySelector('#top-k').value) || 5));
      button.disabled = true;
      button.textContent = 'Searching…';
      statusBox.classList.remove('error');
      statusBox.textContent = 'Embedding query and searching the photo index…';
      results.replaceChildren();
      try {
        const response = await fetch(`/v1/search?top_k=${topK}`, {
          method: 'POST',
          headers: { 'Content-Type': file.type || 'application/octet-stream' },
          body: file
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || `Search failed (${response.status})`);
        document.querySelector('#index-size').textContent = `${data.index_size.toLocaleString()} photos · ${data.search_us} μs index search`;
        if (!data.matches.length) {
          results.innerHTML = '<div class="empty">The index is empty. Build or load a photo index first.</div>';
          statusBox.textContent = 'No matches because the index has no photos.';
          return;
        }
        for (const match of data.matches) {
          const card = document.createElement('article');
          card.className = 'card';
          const image = document.createElement('img');
          image.alt = `Indexed photo ${match.id}`;
          image.loading = 'lazy';
          image.src = `/v1/photos/${encodeURIComponent(match.id)}`;
          image.addEventListener('error', () => card.classList.add('no-preview'), { once: true });
          const info = document.createElement('div');
          info.className = 'card-info';
          const id = document.createElement('span');
          id.className = 'photo-id';
          id.textContent = `Photo ID: ${match.id}`;
          const score = document.createElement('span');
          score.className = 'score';
          score.textContent = Number(match.score).toFixed(4);
          score.title = 'Cosine similarity score; higher ranks as a closer visual match.';
          info.append(id, score);
          card.append(image, info);
          results.append(card);
        }
        const latency = data.embed_latency?.total_us ?? 0;
        statusBox.textContent = `Found ${data.matches.length} closest matches. Query embedding took ${latency.toLocaleString()} μs.`;
      } catch (error) {
        statusBox.classList.add('error');
        statusBox.textContent = error.message;
        results.innerHTML = '<div class="empty">Search failed. Check the API server and image index.</div>';
      } finally {
        button.disabled = false;
        button.textContent = 'Find photo IDs';
      }
    });
  </script>
</body>
</html>
