name: Build and publish Render release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build portable Linux binary
        run: |
          export CARGO_ENCODED_RUSTFLAGS="$(printf '%s\037%s\037%s\037%s' '-C' 'target-cpu=x86-64' '-C' 'llvm-args=-fp-contract=fast')"
          cargo build --locked --release --bin rust-vision-engine

      - name: Bundle binary and DINOv2 model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/models
          cp target/release/rust-vision-engine dist/rust-vision-engine
          curl --fail --location --retry 5 --retry-all-errors \
            https://github.com/microsoft/onnxruntime/releases/download/v1.23.2/onnxruntime-linux-x64-1.23.2.tgz \
            --output /tmp/onnxruntime-linux-x64-1.23.2.tgz
          echo "1fa4dcaef22f6f7d5cd81b28c2800414350c10116f5fdd46a2160082551c5f9b  /tmp/onnxruntime-linux-x64-1.23.2.tgz" \
            | sha256sum --check --status
          tar -xzf /tmp/onnxruntime-linux-x64-1.23.2.tgz -C /tmp
          cp /tmp/onnxruntime-linux-x64-1.23.2/lib/libonnxruntime.so.1.23.2 dist/libonnxruntime.so
          curl --fail --location --retry 5 --retry-all-errors \
            https://huggingface.co/sefaburak/dinov2-small-onnx/resolve/main/dinov2_vits14.onnx \
            --output dist/models/dinov2_vits14.onnx
          echo "4df36ef0716a8f17d984fc7546a3a5d670fda6911eb298592250cb9e26756063  dist/models/dinov2_vits14.onnx" \
            | sha256sum --check --status
          tar --create --gzip --file dist/photo-vector-api-linux-x86_64.tar.gz \
            --directory dist rust-vision-engine libonnxruntime.so models/dinov2_vits14.onnx
          sha256sum dist/photo-vector-api-linux-x86_64.tar.gz > dist/photo-vector-api-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/photo-vector-api-linux-x86_64.tar.gz \
            dist/photo-vector-api-linux-x86_64.tar.gz.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes
